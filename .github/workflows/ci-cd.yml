name: Continuous Integration / Continuous Delivery
on:
  push:
    branches:
      - trunk

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:cov
